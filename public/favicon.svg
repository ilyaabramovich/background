<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 16 16" width="32" height="32" shape-rendering="crispEdges">
  <!-- Minimalistic Naive Wonky Pixel Heart/Smile Form -->
  <!-- Row 3 -->
  <rect x="4" y="3" width="3" height="1" fill="#FF5E7E"/>
  <rect x="9" y="3" width="3" height="1" fill="#FF5E7E"/>

  <!-- Row 4 -->
  <rect x="3" y="4" width="5" height="1" fill="#FF5E7E"/>
  <rect x="8" y="4" width="5" height="1" fill="#FF5E7E"/>

  <!-- Row 5 (Wonky Asymmetry) -->
  <rect x="2" y="5" width="6" height="1" fill="#FF5E7E"/>
  <rect x="9" y="5" width="5" height="1" fill="#FF8EA3"/>

  <!-- Row 6 (Naive eyes added) -->
  <rect x="2" y="6" width="12" height="1" fill="#FF5E7E"/>
  <rect x="4" y="6" width="1" height="1" fill="#1A1A1A"/>
  <rect x="11" y="6" width="1" height="1" fill="#1A1A1A"/>

  <!-- Row 7 -->
  <rect x="3" y="7" width="10" height="1" fill="#FF5E7E"/>

  <!-- Row 8 (Wonky Smile Line) -->
  <rect x="3" y="8" width="10" height="1" fill="#FF5E7E"/>
  <rect x="5" y="8" width="1" height="1" fill="#1A1A1A"/>
  <rect x="6" y="8" width="4" height="1" fill="#FF5E7E"/>
  <rect x="10" y="8" width="1" height="1" fill="#1A1A1A"/>

  <!-- Row 9 -->
  <rect x="4" y="9" width="8" height="1" fill="#FF5E7E"/>
  <rect x="6" y="9" width="4" height="1" fill="#1A1A1A"/>

  <!-- Row 10 (Wavy shift right) -->
  <rect x="5" y="10" width="7" height="1" fill="#FF5E7E"/>

  <!-- Row 11 (Wavy shift left) -->
  <rect x="5" y="11" width="5" height="1" fill="#FF5E7E"/>

  <!-- Row 12 (Wonky tail off-center) -->
  <rect x="6" y="12" width="3" height="1" fill="#FF8EA3"/>

  <!-- Row 13 -->
  <rect x="7" y="13" width="1" height="1" fill="#FF8EA3"/>
</svg>
